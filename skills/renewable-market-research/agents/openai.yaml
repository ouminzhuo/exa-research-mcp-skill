interface:
  display_name: "Renewable Market Research"
  short_description: "Two-stage renewable market workflow with dynamic-frontier recall, ledger verification, and V4 full country wind-market status reports"
  default_prompt: "Use $renewable-market-research to run a two-stage renewable market workflow: first run bounded high-recall search-frontier rounds, then verify, dedupe, reconcile the project ledger, and produce a V4 full country wind-market status report plus lite or executive outputs when needed."
dependencies:
  tools:
    - type: "mcp"
      value: "exa"
      description: "Exa MCP server for semantic web/company/news/research/financial search when available"
      transport: "streamable_http"
      url: "https://mcp.exa.ai/mcp"
    - type: "mcp"
      value: "chrome-mcp"
      description: "User-configured sanitized Chrome MCP for human-browser verification and dynamic pages"
policy:
  allow_implicit_invocation: true
