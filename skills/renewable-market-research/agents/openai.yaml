interface:
  display_name: "Renewable Market Research"
  short_description: "Evidence-driven renewable market workflow with heavy multi-agent research, verification, review, sales actions, and executive briefs"
  default_prompt: "Use $renewable-market-research to run an evidence-driven renewable market workflow: verify pipeline, analyze policy and product fit, run source audit and reflection review, generate sales actions, and produce full/lite reports plus an executive brief."
dependencies:
  tools:
    - type: "mcp"
      value: "exa"
      description: "Exa MCP server for semantic web/company/news/research/financial search when available"
      transport: "streamable_http"
      url: "https://mcp.exa.ai/mcp"
    - type: "mcp"
      value: "chrome-mcp"
      description: "User-configured sanitized Chrome MCP for human-browser verification and dynamic pages"
policy:
  allow_implicit_invocation: true
