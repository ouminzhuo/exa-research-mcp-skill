interface:
  display_name: "Renewable Market Research"
  short_description: "Two-stage renewable market workflow with bounded dynamic-frontier recall, ledger verification, sales actions, and executive briefs"
  default_prompt: "Use $renewable-market-research to run a two-stage renewable market workflow: first run at least five bounded high-recall search-frontier rounds from seed templates, baseline entities, authority sources, and newly discovered entries, with P0/P1 automatic expansion and P2-P4 drift control; then verify, dedupe, reconcile the project ledger, generate sales actions, and produce full/lite reports plus an executive brief."
dependencies:
  tools:
    - type: "mcp"
      value: "exa"
      description: "Exa MCP server for semantic web/company/news/research/financial search when available"
      transport: "streamable_http"
      url: "https://mcp.exa.ai/mcp"
    - type: "mcp"
      value: "chrome-mcp"
      description: "User-configured sanitized Chrome MCP for human-browser verification and dynamic pages"
policy:
  allow_implicit_invocation: true
