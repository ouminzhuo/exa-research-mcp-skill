interface:
  display_name: "Renewable Market Research"
  short_description: "Renewable market workflow with dynamic-frontier recall, strict ledgers, canonical fact freeze, controlled chapter inputs, release audits, and full country wind-market status reports"
  default_prompt: "Use $renewable-market-research to run a renewable market workflow: generate the search plan, run bounded high-recall search-frontier rounds, build source trace and evidence table, verify/dedupe/reconcile the rich master JSON and core ledgers, freeze canonical facts, write chapter drafts only from chapter input manifests with required chapter verification, run the eight release audit checks, then produce the full report plus lite or executive outputs when needed."
dependencies:
  tools:
    - type: "mcp"
      value: "exa"
      description: "Exa MCP server for semantic web/company/news/research/financial search when available"
      transport: "streamable_http"
      url: "https://mcp.exa.ai/mcp"
    - type: "mcp"
      value: "chrome-mcp"
      description: "User-configured sanitized Chrome MCP for human-browser verification and dynamic pages"
policy:
  allow_implicit_invocation: true
